name: E2E

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1-5" # regressão noturna em dias úteis

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - run: bundle exec rubocop

  e2e:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Smoke em PR, regressão em push/agendado
        env:
          BROWSER: ${{ matrix.browser }}
          HEADLESS: "true"
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            bundle exec cucumber -p smoke
          else
            bundle exec cucumber -p ci
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.browser }}
          path: reports/
